      <rect x="20" y="56" width="60" height="20" fill="#000000" />
      <text x="50" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="800" fill="#facc15" text-anchor="middle" transform="translate(0 -30.5) scale(1 1.45)">Hej!</text>
