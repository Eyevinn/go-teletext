      <text x="15" y="27.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#f8fafc">P888</text>
      <text x="85" y="27.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#facc15" text-anchor="end">12:00</text>
