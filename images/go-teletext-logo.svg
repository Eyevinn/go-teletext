      <circle cx="104" cy="50" r="6" fill="#94a3b8" stroke="#0f172a" stroke-width="2.5" />
      <rect x="97" y="64" width="6" height="5" rx="1" fill="#ef4444" />
      <rect x="105" y="64" width="6" height="5" rx="1" fill="#22c55e" />
      <rect x="97" y="72" width="6" height="5" rx="1" fill="#facc15" />
      <rect x="105" y="72" width="6" height="5" rx="1" fill="#22d3ee" />
