name: golangci-lint

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # Pinned so that CI and a local `make lint` agree: formatter output
      # differs between releases. Keep equal to GOLANGCI_LINT_VERSION in the
      # Makefile.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          only-new-issues: true
